<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطالب - محمد الكسادي</title>
    
    <!-- أسطر مهمة جداً لتعريف التطبيق -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#d4af37">
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0a0a0a; --bg-secondary: #161410; --card-bg: rgba(28, 25, 20, 0.85);
            --text-main: #f5f5f5; --text-muted: #b0b0b0; --gold-dark: #8c6218; --gold-light: #d4af37;
            --border-color: rgba(212, 175, 55, 0.3);
        }
        body.light-mode {
            --bg-primary: #f4f6f8; --bg-secondary: #ffffff; --card-bg: #ffffff;
            --text-main: #1a1a1a; --text-muted: #555555; --gold-dark: #8c6218; --gold-light: #b8860b;
            --border-color: rgba(140, 98, 24, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        /* شاشة البداية */
        #splash-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #1f1b14 0%, #050505 100%); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px; z-index: 1000; transition: opacity 0.6s; }
        #splash-screen.hidden { opacity: 0; pointer-events: none; }
        .splash-center { z-index: 2; text-align: center; margin: auto; }
        .grad-cap { font-size: 95px; display: inline-block; animation: floatCap 3s infinite; }
        .welcome-title { font-size: 3rem; font-weight: 900; background: linear-gradient(180deg, #ffffff 0%, #c0c0c0 60%, #757575 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 10px 0 25px; }
        .enter-btn { padding: 14px 55px; font-size: 1.5rem; font-weight: 900; color: #fff; background: linear-gradient(135deg, #b8860b 0%, #5c3d08 50%, #1c1303 100%); border: 2px solid #c0c0c0; border-radius: 50px; cursor: pointer; }
        .splash-footer { z-index: 2; text-align: center; }
        .dev-sub { color: #c0c0c0; font-size: 1rem; font-weight: 700; display: block; }
        .dev-main { font-size: 2.1rem; font-weight: 900; background: linear-gradient(135deg, #e5c158 0%, #8c6218 55%, #3b2806 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; border-bottom: 2px solid rgba(192, 192, 192, 0.3); padding-bottom: 4px; }

        /* الواجهة الرئيسية */
        #main-app { display: none; max-width: 800px; margin: 0 auto; padding: 20px 16px 80px; animation: fadeIn 0.6s; text-align: center; }
        
        /* الشريط العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 10px 15px; margin-bottom: 25px; }
        .quran-verse { font-family: 'Amiri', serif; font-size: 1.3rem; color: var(--gold-light); }
        .settings-icon { font-size: 1.8rem; cursor: pointer; color: var(--gold-light); transition: 0.3s; }
        .settings-icon:hover { transform: rotate(45deg); }

        /* التخطيط المركزي */
        .main-layout { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        
        /* الأقسام العلمية والأدبية */
        .section-row { display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 600px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 20px; flex: 1; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--gold-light); }
        .card-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .card-title { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }

        /* الفواصل الذهبية */
        .gold-divider { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 600px; margin: 15px 0; }
        .divider-text { padding: 0 20px; font-family: 'Cairo'; font-weight: 900; font-size: 1.2rem; color: var(--gold-light); background: var(--bg-primary); }
        .gold-divider::before, .gold-divider::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }

        /* شريط الإرشادات المتواصل (Marquee) */
        .marquee-container { width: 100%; max-width: 600px; overflow: hidden; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 0; margin-top: 5px; white-space: nowrap; position: relative; }
        .marquee-content { display: inline-block; white-space: nowrap; animation: scrollLeft 80s linear infinite; font-weight: 700; color: var(--text-main); }
        .marquee-content span { margin-right: 40px; color: var(--gold-light); }
        /* تأثير الحركة المستمرة */
        @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* الأقسام السفلية */
        .sub-row { display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 600px; }

        /* النوافذ الفرعية */
        .sub-view { display: none; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 22px; margin-top: 20px; width: 100%; max-width: 600px; text-align: right; }
        .sub-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 18px; }
        .back-btn { background: var(--gold-dark); color: #fff; border: none; padding: 8px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .subject-item { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 10px; }

        /* الإعدادات */
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .setting-item:last-child { border-bottom: none; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--gold-light); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* المؤقت */
        .timer-display { font-size: 3rem; font-weight: 900; color: var(--gold-light); text-align: center; margin: 20px 0; font-family: 'Cairo'; }
        .timer-inputs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .timer-inputs input { width: 100px; padding: 10px; text-align: center; font-size: 1.2rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.1); color: var(--text-main); }
        .timer-btns { display: flex; justify-content: center; gap: 10px; }
        .timer-btns button { padding: 10px 20px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; background: var(--gold-dark); color: #fff; }

        @keyframes floatCap { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-center">
            <div class="grad-cap">🎓</div>
            <h1 class="welcome-title">أهلاً وسهلاً</h1>
            <button class="enter-btn" onclick="enterApp()">مرحباً</button>
        </div>
        <div class="splash-footer"><span class="dev-sub">مطور البرنامج</span><div class="dev-main">محمد الكسادي</div></div>
    </div>

    <div id="main-app">
        <div class="top-bar">
            <div class="quran-verse">﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾</div>
            <div class="settings-icon" onclick="openSettings()">⚙️</div>
        </div>

        <div class="main-layout" id="layout-container">
            
            <div class="section-row">
                <div class="card" onclick="openSection('scientific')"><div class="card-icon">🔬</div><div class="card-title">القسم العلمي</div></div>
                <div class="card" onclick="openSection('literary')"><div class="card-icon">📚</div><div class="card-title">القسم الأدبي</div></div>
            </div>

            <div class="gold-divider"><span class="divider-text">إرشادات الطلاب</span></div>
            <div class="marquee-container">
                <div class="marquee-content" id="marquee-text"></div>
            </div>

            <div class="gold-divider"><span class="divider-text">تدريبات ومعلومات</span></div>
            <div class="sub-row">
                <div class="card" onclick="openSection('quiz')"><div class="card-icon">🧠</div><div class="card-title">اختبر نفسك</div></div>
                <div class="card" onclick="openSection('general')"><div class="card-icon">❓</div><div class="card-title">معلومات عامة</div></div>
            </div>

            <div class="gold-divider"><span class="divider-text">تنظيم الوقت والإبداع</span></div>
            <div class="sub-row">
                <div class="card" onclick="openSection('time')"><div class="card-icon">⏳</div><div class="card-title">تنظيم الوقت</div></div>
                <div class="card" onclick="openSection('draw')"><div class="card-icon">🎨</div><div class="card-title">الرسم الحر</div></div>
            </div>

            <div style="text-align: center; margin-top: 20px; color: var(--gold-light); font-weight: 700; font-family: 'Cairo';">
                أتمنى لك النجاح في حياتك العلمية والعملية 🤲
            </div>

        </div>

        <div class="sub-view" id="sub-view">
            <div class="sub-header">
                <h2 id="sub-title" style="color: var(--gold-light);">العنوان</h2>
                <button class="back-btn" onclick="goBack()">رجوع ↩</button>
            </div>
            <div id="sub-content"></div>
        </div>
    </div>

    <script>
        function enterApp() { document.getElementById('splash-screen').classList.add('hidden'); setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; document.getElementById('main-app').style.display = 'block'; }, 550); }

        // 1. الإرشادات المتواصلة
        const tipsList = [
            "ابدأ يومك بذكر الله والدعاء بالتوفيق.", "ضع جدولاً واضحاً لما ستذاكره اليوم.", "ذاكر في مكان هادئ وبعيد عن المشتتات.", "ابدأ بالمادة التي تجدها صعبة وأنت في كامل تركيزك.", "استخدم أسلوب (25 دقيقة مذاكرة و5 دقائق راحة).", "لا تذاكر وأنت متعب، خذ قسطاً من النوم.", "حل تمارين واختبارات سابقة لتثبيت المعلومات.", "اشرح ما تعلمته لشخص آخر أو لنفسك بصوت عالٍ.", "ابتعد عن الهاتف تماماً أثناء فترة المذاكرة.", "راجع دروسك أولاً بأول ولا تؤجلها.", "اشرب كمية كافية من الماء ليبقى عقلك منتعشاً.", "مارس بعض التمارين الرياضية البسيطة لتجديد النشاط.", "لا تقارن نفسك بغيرك، ركز على تطورك الذاتي.", "استخدم الألوان والخرائط الذهنية لتلخيص المعلومات.", "نم مبكراً لتحصل على نوم عميق ومريح.", "تناول طعاماً صحياً، وتجنب الوجبات الثقيلة قبل المذاكرة.", "اطلب المساعدة من معلميك عندما تواجه صعوبة.", "ثق بنفسك وبقدراتك، فأنت قادر على التفوق.", "كافئ نفسك بعد إنجاز أي مهمة دراسية.", "توكل على الله واجعل نيتك طلب العلم النافع."
        ];

        // توليد الإرشادات (مرتين لضمان عدم توقف الشريط)
        document.addEventListener("DOMContentLoaded", () => {
            const marquee = document.getElementById('marquee-text');
            let textHTML = tipsList.map((tip, i) => `<span>${i+1}. ${tip}</span>`).join('');
            marquee.innerHTML = textHTML + textHTML; 
        });

        // 2. الإعدادات
        function openSettings() {
            document.getElementById('layout-container').style.display = 'none';
            document.getElementById('sub-view').style.display = 'block';
            document.getElementById('sub-title').textContent = '⚙️ الإعدادات';
            document.getElementById('sub-content').innerHTML = `
                <div class="setting-item"><span>🔊 صوت التطبيق</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
                <div class="setting-item"><span>🔔 الإشعارات</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
                <div class="setting-item"><span>🌙 الوضع الداكن / الفاتح</span><label class="switch"><input type="checkbox" onchange="toggleTheme()"><span class="slider"></span></label></div>
            `;
        }

        // 3. المؤقت والمنبه
        let timerInterval;
        let timeLeft = 0;
        let alarmAudio = new Audio('https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg');

        function openSection(section) {
            document.getElementById('layout-container').style.display = 'none';
            document.getElementById('sub-view').style.display = 'block';
            const title = document.getElementById('sub-title');
            const content = document.getElementById('sub-content');

            if (section === 'scientific') {
                title.textContent = '🔬 مواد القسم العلمي';
                content.innerHTML = `<p style="color:var(--text-muted); text-align:center;">سيتم إضافة المواد هنا من تطبيق المدير لاحقاً.</p>`;
            } else if (section === 'literary') {
                title.textContent = '📚 مواد القسم الأدبي';
                content.innerHTML = `<p style="color:var(--text-muted); text-align:center;">سيتم إضافة المواد هنا من تطبيق المدير لاحقاً.</p>`;
            } else if (section === 'quiz') {
                title.textContent = '🧠 اختبر نفسك';
                content.innerHTML = `<p style="color:var(--text-muted); text-align:center;">سيتم إضافة الأسئلة هنا لاحقاً.</p>`;
            } else if (section === 'general') {
                title.textContent = '❓ معلومات عامة';
                content.innerHTML = `<p style="color:var(--text-muted); text-align:center;">سيتم إضافة الأسئلة هنا لاحقاً.</p>`;
            } else if (section === 'time') {
                title.textContent = '⏳ تنظيم الوقت والمؤقت';
                content.innerHTML = `
                    <div class="timer-display" id="timer-display">00:00</div>
                    <div class="timer-inputs">
                        <input type="number" id="timer-min" placeholder="أدخل الدقائق" min="1">
                    </div>
                    <div class="timer-btns">
                        <button onclick="startTimer()">بدء المؤقت</button>
                        <button onclick="stopTimer()">إيقاف</button>
                    </div>
                `;
            } else if (section === 'draw') {
                title.textContent = '🎨 لوحة الرسم الحر';
                content.innerHTML = `
                    <div style="display:flex; gap:10px; margin-bottom:10px; justify-content:center;">
                        <button class="back-btn" onclick="setMode('pencil')">✏️ قلم</button>
                        <button class="back-btn" onclick="setMode('eraser')">🧽 ممحاة</button>
                        <button class="back-btn" onclick="clearCanvas()">🗑️ مسح</button>
                    </div>
                    <div id="color-palette" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; max-height:80px; overflow-y:auto;"></div>
                    <div id="canvas-wrapper" style="width:100%; aspect-ratio:1/1; background:#fff; border-radius:10px; overflow:hidden;"><canvas id="drawing-canvas"></canvas></div>
                `;
                setTimeout(initDrawing, 100);
            }
        }

        function startTimer() {
            const min = parseInt(document.getElementById('timer-min').value);
            if (!min || min <= 0) { alert('أدخل عدد الدقائق أولاً'); return; }
            
            timeLeft = min * 60;
            document.getElementById('timer-min').disabled = true;
            updateTimerDisplay();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alarmAudio.play();
                    alert('انتهى الوقت!');
                    document.getElementById('timer-min').disabled = false;
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
            document.getElementById('timer-min').disabled = false;
            timeLeft = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer-display').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function goBack() {
            clearInterval(timerInterval);
            alarmAudio.pause();
            document.getElementById('sub-view').style.display = 'none';
            document.getElementById('layout-container').style.display = 'flex';
            document.getElementById('sub-title').textContent = '';
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        // 4. كود الرسم
        let canvas, currentColor = '#000000';
        function initDrawing() {
            canvas = new fabric.Canvas('drawing-canvas', { width: document.getElementById('canvas-wrapper').clientWidth, height: document.getElementById('canvas-wrapper').clientWidth, backgroundColor: '#ffffff', isDrawingMode: true });
            canvas.freeDrawingBrush.width = 5; canvas.freeDrawingBrush.color = currentColor;
            const palette = document.getElementById('color-palette');
            for (let i = 0; i < 50; i++) {
                const color = `hsl(${(i * 7) % 360}, 80%, 50%)`;
                const swatch = document.createElement('div');
                swatch.style.cssText = `width:25px; height:25px; border-radius:50%; cursor:pointer; background:${color};`;
                swatch.onclick = () => { currentColor = color; canvas.freeDrawingBrush.color = color; };
                palette.appendChild(swatch);
            }
        }
        function setMode(mode) { if (mode === 'pencil') { canvas.isDrawingMode = true; canvas.freeDrawingBrush.color = currentColor; } else if (mode === 'eraser') { canvas.isDrawingMode = true; canvas.freeDrawingBrush.color = '#ffffff'; } }
        function clearCanvas() { if(canvas) { canvas.clear(); canvas.backgroundColor = '#ffffff'; canvas.renderAll(); } }
    </script>
    
    <!-- سطر ربط Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
 </html>
