 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطالب - محمد الكسادي</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0a0a0a; --bg-secondary: #161410; --card-bg: rgba(28, 25, 20, 0.85);
            --text-main: #f5f5f5; --text-muted: #b0b0b0; --gold-dark: #8c6218; --gold-light: #d4af37;
            --border-color: rgba(212, 175, 55, 0.3);
        }
        body.light-mode {
            --bg-primary: #f4f6f8; --bg-secondary: #ffffff; --card-bg: #ffffff;
            --text-main: #1a1a1a; --text-muted: #555555; --gold-dark: #8c6218; --gold-light: #b8860b;
            --border-color: rgba(140, 98, 24, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        #splash-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #1f1b14 0%, #050505 100%); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px; z-index: 1000; transition: opacity 0.6s; }
        #splash-screen.hidden { opacity: 0; pointer-events: none; }
        .splash-center { z-index: 2; text-align: center; margin: auto; }
        .grad-cap { font-size: 95px; display: inline-block; animation: floatCap 3s infinite; }
        .welcome-title { font-size: 3rem; font-weight: 900; background: linear-gradient(180deg, #ffffff 0%, #c0c0c0 60%, #757575 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 10px 0 25px; }
        .enter-btn { padding: 14px 55px; font-size: 1.5rem; font-weight: 900; color: #fff; background: linear-gradient(135deg, #b8860b 0%, #5c3d08 50%, #1c1303 100%); border: 2px solid #c0c0c0; border-radius: 50px; cursor: pointer; }
        .splash-footer { z-index: 2; text-align: center; }
        .dev-sub { color: #c0c0c0; font-size: 1rem; font-weight: 700; display: block; }
        .dev-main { font-size: 2.1rem; font-weight: 900; background: linear-gradient(135deg, #e5c158 0%, #8c6218 55%, #3b2806 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; border-bottom: 2px solid rgba(192, 192, 192, 0.3); padding-bottom: 4px; }

        #main-app { display: none; max-width: 800px; margin: 0 auto; padding: 20px 16px 80px; animation: fadeIn 0.6s; text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 10px 15px; margin-bottom: 25px; }
        .quran-verse { font-family: 'Amiri', serif; font-size: 1.3rem; color: var(--gold-light); }
        .settings-icon { font-size: 1.8rem; cursor: pointer; color: var(--gold-light); transition: 0.3s; }

        .main-layout { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .section-row { display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 600px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 20px; flex: 1; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--gold-light); }
        .card-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .card-title { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }

        .gold-divider { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 600px; margin: 15px 0; }
        .divider-text { padding: 0 20px; font-family: 'Cairo'; font-weight: 900; font-size: 1.2rem; color: var(--gold-light); background: var(--bg-primary); }
        .gold-divider::before, .gold-divider::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }

        .marquee-container { width: 100%; max-width: 600px; overflow: hidden; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 0; margin-top: 5px; white-space: nowrap; position: relative; }
        .marquee-content { display: inline-block; white-space: nowrap; animation: scrollLeft 80s linear infinite; font-weight: 700; color: var(--text-main); }
        .marquee-content span { margin-right: 40px; color: var(--gold-light); }
        @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .sub-row { display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 600px; }
        .sub-view { display: none; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 22px; margin-top: 20px; width: 100%; max-width: 600px; text-align: right; }
        .sub-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 18px; }
        .back-btn { background: var(--gold-dark); color: #fff; border: none; padding: 8px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--gold-light); }
        input:checked + .slider:before { transform: translateX(26px); }

        .alarm-header { text-align: center; margin-bottom: 20px; }
        .alarm-clock { font-size: 3.5rem; font-weight: 900; color: var(--gold-light); font-family: 'Courier New', monospace; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
        .alarm-form { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border: 1px solid var(--border-color); margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .alarm-form input[type="datetime-local"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-main); font-family: inherit; }
        .alarm-form button { background: #00c853; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .alarms-list { display: flex; flex-direction: column; gap: 10px; }
        .alarm-item { display: flex; justify-content: space-between; align-items: center; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold-light); padding: 15px; border-radius: 12px; }
        .alarm-item-info h4 { color: var(--gold-light); margin-bottom: 5px; }
        .alarm-item .delete-alarm-btn { background: #ff2a2a; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        .note-input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.1); color: var(--text-main); margin-bottom: 15px; font-family: inherit; resize: none; height: 100px; }
        .send-note-btn { background: #00c853; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }

        #pdf-viewer { width: 100%; height: 70vh; border-radius: 10px; margin-top: 15px; }
        .material-card { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .material-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .material-card h4 { color: var(--gold-light); font-size: 1.1rem; margin: 0; }
        .pdf-btn-student { background: var(--gold-dark); color: #fff; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        const firebaseConfig = { apiKey: "AIzaSyB1m4F4YvDRwCLjrBHAoZH8rdyH678Cwp0", authDomain: "sadi-platform.firebaseapp.com", databaseURL: "https://sadi-platform-default-rtdb.firebaseio.com", projectId: "sadi-platform", storageBucket: "sadi-platform.firebasestorage.app", messagingSenderId: "97301590450", appId: "1:97301590450:web:29e876db688cbcb3274ab", measurementId: "G-C6GHJBV99P" };
        const app = initializeApp(firebaseConfig);
        window.firebaseDB = getDatabase(app);
        window.firebaseRef = ref; window.firebasePush = push; window.firebaseSet = set; window.firebaseOnValue = onValue;
    </script>
</head>
<body>
    <div id="splash-screen">
        <div class="splash-center"><div class="grad-cap">🎓</div><h1 class="welcome-title">أهلاً وسهلاً</h1><button class="enter-btn" onclick="enterApp()">مرحباً</button></div>
        <div class="splash-footer"><span class="dev-sub">مطور البرنامج</span><div class="dev-main">محمد الكسادي</div></div>
    </div>

    <div id="main-app">
        <div class="top-bar">
            <div class="quran-verse">﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾</div>
            <div class="settings-icon" onclick="openSettings()">⚙️</div>
        </div>
        <div class="main-layout" id="layout-container">
            <div class="section-row">
                <div class="card" onclick="openSection('scientific')"><div class="card-icon">🔬</div><div class="card-title">القسم العلمي</div></div>
                <div class="card" onclick="openSection('literary')"><div class="card-icon">📚</div><div class="card-title">القسم الأدبي</div></div>
            </div>
            <div class="gold-divider"><span class="divider-text">إرشادات الطلاب</span></div>
            <div class="marquee-container"><div class="marquee-content" id="marquee-text"></div></div>
            <div class="gold-divider"><span class="divider-text">تدريبات ومعلومات</span></div>
            <div class="sub-row">
                <div class="card" onclick="openSection('quiz')"><div class="card-icon">🧠</div><div class="card-title">اختبر نفسك</div></div>
                <div class="card" onclick="openSection('general')"><div class="card-icon">❓</div><div class="card-title">معلومات عامة</div></div>
            </div>
            <div class="gold-divider"><span class="divider-text">تنظيم الوقت والإبداع</span></div>
            <div class="sub-row">
                <div class="card" onclick="openSection('time')"><div class="card-icon">⏰</div><div class="card-title">المنبهات</div></div>
                <div class="card" onclick="openSection('draw')"><div class="card-icon">🎨</div><div class="card-title">الرسم الحر</div></div>
            </div>
            <div style="text-align: center; margin-top: 20px; color: var(--gold-light); font-weight: 700;">أتمنى لك النجاح 🤲</div>
        </div>
        <div class="sub-view" id="sub-view">
            <div class="sub-header"><h2 id="sub-title" style="color: var(--gold-light);">العنوان</h2><button class="back-btn" onclick="goBack()">رجوع ↩</button></div>
            <div id="sub-content"></div>
        </div>
    </div>

    <script>
        // --- التهيئة الأساسية ---
        function enterApp() { document.getElementById('splash-screen').classList.add('hidden'); setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; document.getElementById('main-app').style.display = 'block'; }, 550); checkAllAlarms(); }
        
        const tipsList = ["ابدأ يومك بذكر الله.", "ضع جدولاً واضحاً.", "ذاكر في مكان هادئ.", "لا تذاكر وأنت متعب.", "حل تمارين واختبارات.", "اشرح ما تعلمته.", "ابتعد عن الهاتف.", "راجع دروسك أولاً بأول.", "اشرب كمية كافية من الماء.", "مارس التمارين الرياضية."];
        document.addEventListener("DOMContentLoaded", () => {
            const marquee = document.getElementById('marquee-text');
            marquee.innerHTML = tipsList.map((tip, i) => `<span>${i+1}. ${tip}</span>`).join('') + tipsList.map((tip, i) => `<span>${i+1}. ${tip}</span>`).join('');
        });

        // --- الإعدادات والملاحظات ---
        function openSettings() {
            document.getElementById('layout-container').style.display = 'none';
            document.getElementById('sub-view').style.display = 'block';
            document.getElementById('sub-title').textContent = '⚙️ الإعدادات';
            document.getElementById('sub-content').innerHTML = `
                <div class="setting-item"><span>🌙 الوضع الداكن / الفاتح</span><label class="switch"><input type="checkbox" onchange="toggleTheme()"><span class="slider"></span></label></div>
                <div class="gold-divider" style="margin: 20px 0;"><span class="divider-text">إرسال ملاحظة للمدير</span></div>
                <textarea id="note-text" class="note-input" placeholder="اكتب ملاحظتك..."></textarea>
                <button class="send-note-btn" onclick="sendNoteToAdmin()">📤 إرسال الملاحظة</button>
            `;
        }

        function sendNoteToAdmin() {
            const note = document.getElementById('note-text').value;
            if(!note) { alert('اكتب ملاحظتك أولاً'); return; }
            const notesRef = window.firebaseRef(window.firebaseDB, 'notes');
            window.firebaseSet(window.firebasePush(notesRef), { note: note, date: new Date().toLocaleString() }).then(() => {
                alert('تم إرسال الملاحظة بنجاح!'); document.getElementById('note-text').value = '';
            });
        }

        // --- الأقسام ---
        let currentSection = 'scientific';
        function openSection(section) {
            document.getElementById('layout-container').style.display = 'none';
            document.getElementById('sub-view').style.display = 'block';
            const title = document.getElementById('sub-title');
            const content = document.getElementById('sub-content');
            currentSection = section;

            if (section === 'scientific' || section === 'literary') {
                title.textContent = section === 'scientific' ? '🔬 مواد القسم العلمي' : '📚 مواد القسم الأدبي';
                content.innerHTML = `<p style="text-align:center;">جاري التحميل...</p>`;
                window.firebaseOnValue(window.firebaseRef(window.firebaseDB, 'materials/' + section), (snapshot) => {
                    content.innerHTML = ''; const data = snapshot.val();
                    if (!data) { content.innerHTML = `<p style="text-align:center;">لا توجد مواد.</p>`; return; }
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        content.innerHTML += `<div class="material-card">${item.img ? `<img src="${item.img}">` : ''}<h4>${item.name}</h4>${item.pdf ? `<button class="pdf-btn-student" onclick="openPDFReader('${item.pdf}')">📄 قراءة الملزمة</button>` : ''}</div>`;
                    });
                });
            } else if (section === 'time') {
                title.textContent = '⏰ مدير المنبهات';
                content.innerHTML = `
                    <div class="alarm-header"><div class="alarm-clock" id="live-clock">00:00:00</div></div>
                    <div class="alarm-form">
                        <input type="datetime-local" id="alarm-datetime">
                        <button onclick="addAlarm()">➕ إضافة منبه</button>
                    </div>
                    <div class="alarms-list" id="alarms-list"></div>
                `;
                startLiveClock(); loadAlarms();
            } else if (section === 'draw') {
                title.textContent = '🎨 لوحة الرسم';
                content.innerHTML = `
                    <div style="display:flex; gap:10px; margin-bottom:10px; justify-content:center;"><button class="back-btn" onclick="setMode('pencil')">✏️ قلم</button><button class="back-btn" onclick="setMode('eraser')">🧽 ممحاة</button><button class="back-btn" onclick="clearCanvas()">🗑️ مسح</button></div>
                    <div id="color-palette" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;"></div>
                    <div id="canvas-wrapper" style="width:100%; aspect-ratio:1/1; background:#fff; border-radius:10px; overflow:hidden;"><canvas id="drawing-canvas"></canvas></div>
                `;
                setTimeout(initDrawing, 100);
            } else { title.textContent = 'قريباً...'; content.innerHTML = `<p style="text-align:center;">سيتم إضافة المحتوى قريباً.</p>`; }
        }

        function openPDFReader(pdfUrl) {
            document.getElementById('sub-content').innerHTML = `<button class="back-btn" onclick="openSection('${currentSection}')">عودة</button><iframe src="${pdfUrl}" style="width:100%; height:70vh; border:none; margin-top:10px;"></iframe>`;
        }

        // --- المنبهات (المنطق الجديد) ---
        let alarmAudio = new Audio('https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg');
        let liveClockInterval;

        function startLiveClock() {
            clearInterval(liveClockInterval);
            liveClockInterval = setInterval(() => {
                const display = document.getElementById('live-clock');
                if(display) display.textContent = new Date().toLocaleTimeString('ar-EG', { hour12: true });
            }, 1000);
        }

        function addAlarm() {
            const datetime = document.getElementById('alarm-datetime').value;
            if(!datetime) { alert('يرجى اختيار التاريخ والوقت'); return; }
            
            // حفظ في ذاكرة الهاتف
            let alarms = JSON.parse(localStorage.getItem('studentAlarms')) || [];
            alarms.push({ id: Date.now(), time: datetime });
            localStorage.setItem('studentAlarms', JSON.stringify(alarms));
            
            document.getElementById('alarm-datetime').value = '';
            loadAlarms();
            alert('تم ضبط المنبه بنجاح!');
        }

        function loadAlarms() {
            const list = document.getElementById('alarms-list');
            if(!list) return;
            let alarms = JSON.parse(localStorage.getItem('studentAlarms')) || [];
            
            if(alarms.length === 0) { list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">لا توجد منبهات.</p>'; return; }
            
            list.innerHTML = '';
            alarms.forEach(alarm => {
                const div = document.createElement('div');
                div.className = 'alarm-item';
                div.innerHTML = `
                    <div class="alarm-item-info"><h4>⏰ ${new Date(alarm.time).toLocaleString('ar-EG')}</h4></div>
                    <button class="delete-alarm-btn" onclick="deleteAlarm(${alarm.id})">🗑️</button>
                `;
                list.appendChild(div);
            });
        }

        function deleteAlarm(id) {
            let alarms = JSON.parse(localStorage.getItem('studentAlarms')) || [];
            alarms = alarms.filter(a => a.id !== id);
            localStorage.setItem('studentAlarms', JSON.stringify(alarms));
            loadAlarms();
        }

        // دالة فحص المنبهات (تعمل في الخلفية)
        function checkAllAlarms() {
            setInterval(() => {
                let alarms = JSON.parse(localStorage.getItem('studentAlarms')) || [];
                const now = new Date().getTime();
                
                alarms.forEach(alarm => {
                    const alarmTime = new Date(alarm.time).getTime();
                    // إذا حان الوقت (خلال 2 ثانية)
                    if (now >= alarmTime && now < alarmTime + 2000) {
                        alarmAudio.play();
                        alert(`⏰ حان وقت المنبه: ${new Date(alarm.time).toLocaleString('ar-EG')}`);
                        // حذف المنبه بعد الرنين
                        let updatedAlarms = alarms.filter(a => a.id !== alarm.id);
                        localStorage.setItem('studentAlarms', JSON.stringify(updatedAlarms));
                        loadAlarms();
                    }
                });
            }, 1000); // يفحص كل ثانية
        }

        function goBack() {
            clearInterval(liveClockInterval);
            alarmAudio.pause();
            document.getElementById('sub-view').style.display = 'none';
            document.getElementById('layout-container').style.display = 'flex';
            document.getElementById('sub-title').textContent = '';
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        // --- الرسم ---
        let canvas, currentColor = '#000000';
        function initDrawing() {
            canvas = new fabric.Canvas('drawing-canvas', { width: document.getElementById('canvas-wrapper').clientWidth, height: document.getElementById('canvas-wrapper').clientWidth, backgroundColor: '#ffffff', isDrawingMode: true });
            canvas.freeDrawingBrush.width = 5; canvas.freeDrawingBrush.color = currentColor;
            const palette = document.getElementById('color-palette');
            for (let i = 0; i < 50; i++) {
                const color = `hsl(${(i * 7) % 360}, 80%, 50%)`;
                const swatch = document.createElement('div');
                swatch.style.cssText = `width:25px; height:25px; border-radius:50%; cursor:pointer; background:${color};`;
                swatch.onclick = () => { currentColor = color; canvas.freeDrawingBrush.color = color; };
                palette.appendChild(swatch);
            }
        }
        function setMode(mode) { if (mode === 'pencil') { canvas.isDrawingMode = true; canvas.freeDrawingBrush.color = currentColor; } else if (mode === 'eraser') { canvas.isDrawingMode = true; canvas.freeDrawingBrush.color = '#ffffff'; } }
        function clearCanvas() { if(canvas) { canvas.clear(); canvas.backgroundColor = '#ffffff'; canvas.renderAll(); } }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
    </script>
</body>
 </html>
